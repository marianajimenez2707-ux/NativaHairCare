<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/contactos.css">
    <title>Nativa Hair Care</title>
    <link rel="icon" href="../imagenes/logo.jpg" type="image/jpg">
</head>

<body>

<header>
    <div>
        <img id="logo" src="../imagenes/logo.jpg">
    </div>

    <div>
        <h1>Nativa Hair Care</h1>
    </div>

    <div>
        <a href="index.html">Pagina Principal</a>
        <a href="../html/catalogo.html">Catalogo</a>
        <a href="../html/contactos.html">Contactos</a>
    </div>
</header>

<div class="contact-form">
    <span class="heading">Contactanos</span>

    <form>
        <label for="name">Nombre completo:</label>
        <input type="text" id="name" required>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Mensaje:</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">Enviar</button>
    </form>
</div>

<footer class="site-footer">
    <div class="footer-content">
        <div class="social-links">
            <a href="https://www.instagram.com/nativa.hair.care" target="_blank" rel="noopener noreferrer" class="social-link">
                <span class="social-icon">IG</span>
                <span>@nativa.hair.care</span>
            </a>
            <a href="https://www.tiktok.com/@nativa.hair.care" target="_blank" rel="noopener noreferrer" class="social-link">
                <span class="social-icon">TT</span>
                <span>@nativa.hair.care</span>
            </a>
        </div>
        <p class="footer-copy">Copyright @Nativa Hair Care</p>
    </div>
</footer>

</body>
</html>
